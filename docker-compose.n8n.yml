services:
  # PostgreSQL 数据库 (专门给 n8n 使用)
  n8n-postgres:
    image: postgres:16-alpine
    container_name: casper_n8n_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n_user
      POSTGRES_PASSWORD: n8n_password_change_me
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # 使用 5433 避免与其他 PostgreSQL 冲突
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n_user -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n8n_network

  # n8n 工作流引擎 (使用官方镜像)
  n8n:
    image: n8nio/n8n:latest
    container_name: casper_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"  # n8n UI 端口
    environment:
      # 数据库配置
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: n8n_user
      DB_POSTGRESDB_PASSWORD: n8n_password_change_me
      DB_POSTGRESDB_SCHEMA: public
      
      # n8n 基础配置
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      
      # 时区配置
      GENERIC_TIMEZONE: Asia/Shanghai
      TZ: Asia/Shanghai
      
      # 执行配置
      EXECUTIONS_MODE: regular
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: true
      
      # API 配置 - 允许外部调用
      N8N_API_KEY_AUTH_ENABLED: true
      
      # 安全配置
      N8N_DIAGNOSTICS_ENABLED: false
      N8N_PERSONALIZATION_ENABLED: false
      
      # 日志配置
      N8N_LOG_LEVEL: info
      N8N_LOG_OUTPUT: console
      
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-postgres:
        condition: service_healthy
    networks:
      - n8n_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  n8n_postgres_data:
    driver: local
  n8n_data:
    driver: local

networks:
  n8n_network:
    driver: bridge

