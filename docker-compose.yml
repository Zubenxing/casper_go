version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: casper_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: casper_password
      MYSQL_DATABASE: casper_platform
      MYSQL_USER: casper
      MYSQL_PASSWORD: casper_password
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - casper_network

  # Casper Platform 应用
  app:
    build: .
    container_name: casper_app
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    depends_on:
      - mysql
    environment:
      TZ: Asia/Shanghai
    networks:
      - casper_network

volumes:
  mysql_data:

networks:
  casper_network:
    driver: bridge

